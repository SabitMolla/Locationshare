services:
  locationshare:
    build: .
    container_name: locationshare-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=change-this-to-a-random-secret-in-dokploy
    volumes:
      - locationshare_data:/app/data

volumes:
  locationshare_data:
    name: locationshare_data
